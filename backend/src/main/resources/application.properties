

spring.application.name=hookforge

# PostgreSQL
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hookforge}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hookforge}
spring.datasource.username=${DB_USERNAME:hookforge}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: validate the schema; Flyway owns database migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=hookforge-consumers
spring.kafka.producer.acks=all
hookforge.kafka.outbox-topic=hookforge.outbox-events
# Health and application information
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.db.enabled=true

# HTTP server
server.port=8080
hookforge.cors.allowed-origins=${HOOKFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
hookforge.delivery.poll-interval-ms=1000
hookforge.delivery.recovery-interval-ms=30000
hookforge.delivery.recovery-stale-seconds=120
hookforge.delivery.recovery-batch-size=100

# Actuator application information
management.info.env.enabled=true
info.app.name=HookForge
info.app.description=Multi-tenant distributed webhook delivery infrastructure
info.app.version=0.0.1-SNAPSHOT
info.app.java-version=21
hookforge.demo.tenant-id=${HOOKFORGE_DEMO_TENANT_ID:}
