

spring.application.name=hookforge

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hookforge}
spring.datasource.username=${DB_USERNAME:hookforge}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: validate the schema; Flyway owns database migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all

# Health and application information
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# HTTP server
server.port=8080
