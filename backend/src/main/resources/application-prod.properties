spring.application.name=hookforge

# Production database: all credentials must be supplied externally
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database migrations and validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=hookforge-consumers
spring.kafka.producer.acks=all
hookforge.kafka.outbox-topic=hookforge.outbox-events

# CORS: production frontend origin required
hookforge.cors.allowed-origins=${HOOKFORGE_CORS_ALLOWED_ORIGINS}

# Encryption key is read by WebhookSecretEncryptionService
# HOOKFORGE_ENCRYPTION_KEY must be supplied as an environment variable.

# Monitoring


management.endpoints.web.exposure.include=health,info,metrics
# HTTP server
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=20s

# Delivery configuration
hookforge.delivery.poll-interval-ms=1000
hookforge.delivery.recovery-interval-ms=30000
hookforge.delivery.recovery-stale-seconds=120
hookforge.delivery.recovery-batch-size=100

# Logging
logging.level.org.flywaydb=INFO

management.endpoint.health.show-details=never
management.health.db.enabled=true

hookforge.bootstrap.secret=${HOOKFORGE_BOOTSTRAP_SECRET}