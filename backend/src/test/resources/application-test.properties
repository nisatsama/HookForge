# This profile isolates integration-test tables and Flyway history from the
# application's default schema. Override credentials with the TEST_DB_* vars.
spring.datasource.url=${HOOKFORGE_TEST_DB_URL:jdbc:postgresql://localhost:5433/hookforge}
spring.datasource.username=${HOOKFORGE_TEST_DB_USERNAME:hookforge}
spring.datasource.password=${HOOKFORGE_TEST_DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.schemas=hookforge_api_key_test
spring.flyway.default-schema=hookforge_api_key_test
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=hookforge_api_key_test
spring.jpa.open-in-view=false
